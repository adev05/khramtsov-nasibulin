name: Coursework
on:
  push:
    branches: [coursework]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.14.4
      - run: ruff check --output-format concise services/orders/orders/api.py
